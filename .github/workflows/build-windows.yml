name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Indicar repositorio de listas
        run: |
          node -e "require('fs').writeFileSync('lists-config.json', JSON.stringify({ repo: process.env.GITHUB_REPOSITORY }))"
      - name: Generar .exe
        run: npm run dist
      - name: Publicar .exe
        uses: actions/upload-artifact@v4
        with:
          name: PelisLD-PC-exe
          path: dist/PelisLD-PC.exe
